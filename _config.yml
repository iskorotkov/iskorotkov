title: Ivan Korotkov
description: Lead Go Developer
url: https://iskorotkov.com
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

author: Ivan Korotkov
twitter:
  card: summary_large_image
social:
  name: Ivan Korotkov
  links:
    - https://github.com/iskorotkov
    - https://www.linkedin.com/in/iskorotkov/
    - https://t.me/iskorotkov

include:
  - .well-known
  - _redirects
  - _headers

exclude:
  - LICENSE
  - CNAME
  - Gemfile
  - Gemfile.lock
  - wrangler.jsonc
  - .ruby-version
  - README.md
  - package.json
  - package-lock.json

defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-image.png
